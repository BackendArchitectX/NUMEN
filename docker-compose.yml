name: numen

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-numen}
      POSTGRES_USER: ${POSTGRES_USER:-numen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Run the one-step start command.}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numen} -d ${POSTGRES_DB:-numen}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s
    volumes:
      - numen_postgres:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - numen-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-numen}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-numen}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      NUMEN_HTTP_FETCH_ENABLED: ${NUMEN_HTTP_FETCH_ENABLED:-true}
      NUMEN_MAX_FETCH_URLS: ${NUMEN_MAX_FETCH_URLS:-8}
      NUMEN_ALLOWED_ORIGINS: ${NUMEN_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NUMEN_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - numen-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NUMEN_WEB_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 15s
    logging: *default-logging
    networks:
      - numen-network

networks:
  numen-network:
    driver: bridge

volumes:
  numen_postgres:
