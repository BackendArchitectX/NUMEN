services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-numen}
      POSTGRES_USER: ${POSTGRES_USER:-numen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-numen}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numen} -d ${POSTGRES_DB:-numen}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - numen_pg:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-numen}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-numen}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-numen}
      NUMEN_HTTP_FETCH_ENABLED: ${NUMEN_HTTP_FETCH_ENABLED:-true}
      NUMEN_MAX_FETCH_URLS: ${NUMEN_MAX_FETCH_URLS:-8}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  numen_pg:
