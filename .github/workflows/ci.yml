name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository · standards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate repository structure
        run: bash scripts/quality/check-structure.sh
      - name: Validate launcher syntax
        run: bash scripts/quality/check-runtime.sh
      - name: Validate whitespace in latest change
        run: git diff --check HEAD^ HEAD
      - name: Validate Compose model
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
        run: docker compose config --quiet

  backend:
    name: Backend · verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        working-directory: backend
        run: mvn -B --no-transfer-progress verify

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build

  smoke:
    name: Full stack · one-step smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: [repository, backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start exactly as a user does
        run: ./start.sh --no-browser
      - name: Verify gateway and API
        run: |
          curl --fail --retry 10 --retry-delay 2 http://localhost:5173/healthz
          curl --fail --retry 10 --retry-delay 2 http://localhost:5173/api/v1/health
      - name: Exercise end-to-end workflow
        shell: bash
        run: |
          set -Eeuo pipefail

          created="$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"Find backend job openings from permitted public sources and return traceable records"}' \
            http://localhost:5173/api/v1/tasks)"

          task_id="$(printf '%s' "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          [[ -n "$task_id" ]]

          completed=false
          for _ in $(seq 1 30); do
            state="$(curl --fail --silent "http://localhost:5173/api/v1/tasks/$task_id")"
            status="$(printf '%s' "$state" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            case "$status" in
              COMPLETED) completed=true; break ;;
              FAILED|CANCELLED) printf '%s\n' "$state"; exit 1 ;;
            esac
            sleep 1
          done
          [[ "$completed" == true ]]

          curl --fail --silent "http://localhost:5173/api/v1/tasks/$task_id/records?limit=10" \
            | python3 -c 'import json,sys; rows=json.load(sys.stdin); assert rows; assert all(r["sourceType"]=="DEMO" for r in rows); assert all(r["sourceUrl"].startswith("urn:numen:demo:") for r in rows)'

          curl --fail --silent "http://localhost:5173/api/v1/tasks/$task_id/export.csv" -o /tmp/numen-export.csv
          grep -q 'source_url' /tmp/numen-export.csv

      - name: Verify idempotent one-step start
        run: ./start.sh --no-browser --no-build
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose logs --tail 250
      - name: Stop and remove ephemeral CI data
        if: always()
        run: docker compose down --volumes --remove-orphans
