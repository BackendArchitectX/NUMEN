name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository · standards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate repository structure
        run: bash scripts/quality/check-structure.sh
      - name: Validate launcher syntax
        run: bash scripts/quality/check-runtime.sh
      - name: Validate source policy
        run: bash scripts/quality/check-source-policy.sh
      - name: Validate whitespace in latest change
        run: git diff --check HEAD^ HEAD
      - name: Validate Compose model
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
        run: docker compose config --quiet

  backend:
    name: Backend · verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        working-directory: backend
        run: mvn -B --no-transfer-progress verify

  frontend:
    name: Frontend · test + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Component state tests
        working-directory: frontend
        run: npm run test:components
      - name: Production build
        working-directory: frontend
        run: npm run build

  smoke:
    name: Full stack · one-step smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: [repository, backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start exactly as a user does
        run: ./start.sh --no-browser
      - name: Verify gateway and API
        run: |
          curl --fail --retry 10 --retry-delay 2 http://localhost:5173/healthz
          curl --fail --retry 10 --retry-delay 2 http://localhost:5173/api/v1/health
      - name: Exercise end-to-end workflow
        shell: bash
        run: |
          set -Eeuo pipefail

          idempotency_key="ci-${GITHUB_RUN_ID}-workflow"
          payload='{"prompt":"Find backend job openings from permitted public sources and return traceable records"}'

          created="$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: ${idempotency_key}" \
            -d "$payload" \
            http://localhost:5173/api/v1/tasks)"

          replayed="$(curl --fail --silent \
            -D /tmp/numen-replay.headers \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: ${idempotency_key}" \
            -d "$payload" \
            http://localhost:5173/api/v1/tasks)"

          task_id="$(printf '%s' "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          replayed_id="$(printf '%s' "$replayed" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          [[ -n "$task_id" && "$task_id" == "$replayed_id" ]]
          grep -qi '^Idempotency-Replayed: true' /tmp/numen-replay.headers

          completed=false
          for _ in $(seq 1 30); do
            state="$(curl --fail --silent "http://localhost:5173/api/v1/tasks/$task_id")"
            status="$(printf '%s' "$state" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            case "$status" in
              COMPLETED) completed=true; break ;;
              FAILED|CANCELLED) printf '%s\n' "$state"; exit 1 ;;
            esac
            sleep 1
          done
          [[ "$completed" == true ]]

          curl --fail --silent "http://localhost:5173/api/v1/tasks/$task_id/records?limit=10" \
            | python3 -c 'import json,sys; rows=json.load(sys.stdin); assert rows; assert all(r["sourceType"]=="DEMO" for r in rows); assert all(r["sourceUrl"].startswith("urn:numen:demo:") for r in rows)'

          curl --fail --silent "http://localhost:5173/api/v1/tasks/$task_id/timeline" \
            | python3 -c 'import json,sys; events=json.load(sys.stdin); kinds=[e["eventType"] for e in events]; assert events; assert kinds[0]=="CREATED"; assert "COMPLETED" in kinds; assert events[-1]["status"]=="COMPLETED"; assert events[-1]["progress"]==100'

          curl --fail --silent "http://localhost:5173/api/v1/tasks/$task_id/export.csv" -o /tmp/numen-export.csv
          grep -q 'source_url' /tmp/numen-export.csv

      - name: Verify idempotent one-step start
        run: ./start.sh --no-browser --no-build
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose logs --tail 250
      - name: Stop and remove ephemeral CI data
        if: always()
        run: docker compose down --volumes --remove-orphans
