map $request_method $numen_mutation_key {
  default "";
  POST $binary_remote_addr;
}

map $request_uri $numen_sse_key {
  default "";
  ~^/api/v1/tasks/[^/]+/events$ $binary_remote_addr;
}

limit_req_zone $numen_mutation_key zone=numen_mutation_rate:10m rate=5r/s;
limit_conn_zone $numen_sse_key zone=numen_sse_connections:10m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 64k;

  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;
  limit_conn_log_level warn;
  error_page 429 = @numen_rate_limited;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:" always;
  add_header X-Correlation-ID $request_id always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    limit_req zone=numen_mutation_rate burst=10 nodelay;
    limit_conn numen_sse_connections 4;

    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Correlation-ID $request_id;
    proxy_hide_header X-Correlation-ID;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
  }

  location @numen_rate_limited {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Correlation-ID $request_id always;
    return 429 '{"timestamp":"$time_iso8601","status":429,"error":"Too Many Requests","code":"GATEWAY_RATE_LIMIT","message":"Gateway request or realtime connection limit exceeded","path":"$uri","correlationId":"$request_id"}';
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
